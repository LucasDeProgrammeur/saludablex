services:
  pocketbase:
    build: .
    container_name: saludablex-pocketbase
    restart: unless-stopped
    ports:
      - "8092:8090"   # host (VPS) port 8092 → container port 8090
    env_file:
      - .env
    volumes:
      # Database + uploaded photos. Back this folder up.
      - ./pb_data:/pb/pb_data
      # Mounted so changes to hooks/migrations apply without rebuilding the image
      - ./pb_hooks:/pb/pb_hooks
      - ./pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
